<!DOCTYPE html>
<html>
<head>
  <title>Password Hash Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }
    input, button {
      padding: 10px;
      margin: 10px 0;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      background: #000;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.8;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 5px;
      word-break: break-all;
    }
    .warning {
      background: #fff3cd;
      border: 1px solid #ffc107;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h1>Blog Password Hash Generator</h1>
  
  <div class="warning">
    <strong>⚠️ Security Note:</strong> This generates a hash for your password. 
    The hash is safe to put in your GitHub repo, but keep your actual password secret!
  </div>
  
  <label for="password">Enter your password:</label>
  <input type="password" id="password" placeholder="Your password">
  
  <button onclick="generateHash()">Generate Hash</button>
  
  <div id="result" style="display: none;">
    <strong>Your password hash:</strong>
    <pre id="hash-output"></pre>
    <p>Copy this hash and paste it into <code>blog.js</code> replacing <code>correctPasswordHash</code></p>
  </div>

  <script>
    async function generateHash() {
      const password = document.getElementById('password').value;
      if (!password) {
        alert('Please enter a password');
        return;
      }
      
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      
      document.getElementById('hash-output').textContent = hash;
      document.getElementById('result').style.display = 'block';
      
      // Clear password field
      document.getElementById('password').value = '';
    }
    
    // Allow Enter key
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        generateHash();
      }
    });
  </script>
</body>
</html>
